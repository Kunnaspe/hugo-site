version: 0.2

environment_variables:
  plaintext:
    HUGO_VERSION: "0.155.1"

phases:
  install:
    commands:
      - echo "Installing Hugo $HUGO_VERSION"
      - curl -L -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_Linux-64bit.tar.gz"
      - tar -xzf hugo.tar.gz
      - mv hugo /usr/local/bin/hugo
      - hugo version

  pre_build:
    commands:
      - echo "Installing PaperMod theme"
      - git clone --depth 1 https://github.com/adityatelange/hugo-PaperMod themes/PaperMod

  build:
    commands:
      - echo "Building Hugo site"
      - hugo --minify

artifacts:
  files:
    - '**/*'
  base-directory: 'public'
